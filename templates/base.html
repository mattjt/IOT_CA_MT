<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title or "IoT Motion Camera" }}</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body { background: #f6f7fb; }
    .brand { letter-spacing: .2px; }
    .card { border: 0; box-shadow: 0 6px 20px rgba(15, 23, 42, 0.06); }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
    .log-box { height: 220px; overflow: auto; white-space: pre-wrap; background: #0b1220; color: #e5e7eb; border-radius: .75rem; padding: .75rem; }
    .snap { max-height: 420px; object-fit: contain; background: #fff; }
    .muted { color: #6b7280; }
  </style>
</head>
<body>

<nav class="navbar navbar-expand-lg bg-white border-bottom">
  <div class="container">
    <span class="navbar-brand fw-semibold brand">IoT Motion Camera</span>
    <div class="ms-auto d-flex gap-3 align-items-center">
      {% if username %}
        <span class="text-secondary small">Signed in as <strong>{{ username }}</strong></span>
        <a class="btn btn-sm btn-outline-secondary" href="/logout">Logout</a>
      {% endif %}
    </div>
  </div>
</nav>

<main class="container py-4">
  {% block content %}{% endblock %}
</main>

</body>
</html>
