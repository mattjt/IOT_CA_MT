<!-- templates/login.html -->
{% extends "base.html" %}
{% set title = "Login" %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-md-6 col-lg-5">
    <div class="card">
      <div class="card-body p-4">
        <h1 class="h4 mb-1">Sign in</h1>
        <p class="muted mb-4">Access your IoT motion dashboard.</p>

        {% if error %}
          <div class="alert alert-danger">{{ error }}</div>
        {% endif %}

        <form method="post" action="/login" autocomplete="on">
          <div class="mb-3">
            <label class="form-label" for="username">Username</label>
            <input class="form-control" id="username" name="username" type="username" required autofocus>
          </div>

          <div class="mb-3">
            <label class="form-label" for="password">Password</label>
            <input class="form-control" id="password" name="password" type="password" required>
          </div>

          <button class="btn btn-primary w-100" type="submit">Login</button>
        </form>

        <div class="text-center mt-3">
          <span class="muted">No account?</span>
          <a href="/register">Create one</a>
        </div>
      </div>
    </div>

    <div class="text-center small muted mt-3">
      Protected by HTTPS. Passwords are stored securely (hashed).
    </div>
  </div>
</div>
{% endblock %}
